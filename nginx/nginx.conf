# ============================================================
# LASTBOT — конфигурация сайта
# Файл подключается из /etc/nginx/conf.d/*.conf внутри http{}
# основного nginx.conf образа nginx:alpine.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # ---- gzip: CSS / JS / JSON / SVG / текст ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml
        text/plain;

    # ВАЖНО (особенность nginx): если location задаёт свой add_header,
    # заголовки уровня server в нём не наследуются.
    # Поэтому базовые заголовки безопасности продублированы в каждом location.

    # ---- служебная проверка живости (используется HEALTHCHECK) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok";
    }

    # ---- админ-панель и API (Node-бэкенд в этом же контейнере) ----
    location ^~ /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- статика с версионированием: кэш 1 день, immutable ----
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|otf)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # ---- Кабинет альянса: отдельная статическая страница ----
    location = /dashboard {
        try_files /dashboard.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---- Личный кабинет (JWT-авторизация) ----
    location = /account {
        try_files /account.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ---- HTML и SPA-fallback: любой неизвестный путь -> index.html ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        error_page 404 /index.html;
    }
}
